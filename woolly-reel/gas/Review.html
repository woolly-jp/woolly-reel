<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --kinari:#f4efe6; --charcoal:#3a3836; --gray:#807a72; --line:#ddd5c8; --warn:#9a4a2f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--kinari); color:var(--charcoal);
         font-family:"Hiragino Sans","Noto Sans JP",sans-serif; line-height:1.7; }
  main { max-width:460px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-family:"Hiragino Mincho ProN","Noto Serif JP",serif; font-weight:500; font-size:20px;
       letter-spacing:.08em; margin:4px 0 2px; text-align:center; }
  .sub { text-align:center; color:var(--gray); font-size:13px; margin-bottom:16px; }
  video { width:100%; aspect-ratio:9/16; background:#22201f; border-radius:10px; display:block; }
  .hint { font-size:12px; color:var(--gray); margin:6px 0 18px; }
  label { display:block; font-size:13px; color:var(--gray); margin:0 0 6px; }
  textarea { width:100%; min-height:230px; padding:12px; border:1px solid var(--line); border-radius:8px;
             font:inherit; font-size:15px; background:#fffdf9; color:inherit; }
  ul { margin:14px 0 0; padding:12px 14px 12px 30px; background:#fffdf9; border:1px solid var(--line);
       border-radius:8px; font-size:13px; }
  .memo { margin-top:12px; padding:10px 12px; border-left:3px solid var(--warn); background:#fbf1ea;
          font-size:13px; color:var(--warn); }
  .btns { display:flex; gap:10px; margin-top:20px; }
  button { flex:1; padding:15px 8px; border-radius:999px; font:inherit; font-size:16px; cursor:pointer; }
  #post { flex:2; background:var(--charcoal); color:#fffdf9; border:1px solid var(--charcoal); }
  #skip { background:transparent; color:var(--charcoal); border:1px solid var(--gray); }
  button:disabled { opacity:.45; cursor:default; }
  #msg { margin-top:16px; text-align:center; font-size:15px; min-height:1.7em; }
  #msg a { color:inherit; }
  .hide { display:none; }
</style>
</head>
<body>
<main>
  <h1>投稿の確認</h1>
  <div class="sub" id="sub">読み込み中…</div>
  <div id="body" class="hide">
    <video id="video" controls playsinline loop></video>
    <div class="hint">動画が出ないときは、数分待ってから開き直してください。</div>
    <label for="caption">キャプション(ここで直せます)</label>
    <textarea id="caption"></textarea>
    <div id="memo" class="memo hide"></div>
    <ul>
      <li>動画の最後が実物の商品写真で終わっている</li>
      <li>商品名、価格、文字に誤りや切れがない</li>
      <li>健康への効果を言い切っていない</li>
      <li>季節に合っていて、在庫のある商品である</li>
    </ul>
    <div class="btns">
      <button id="skip">見送る</button>
      <button id="post">投稿する</button>
    </div>
  </div>
  <div id="msg"></div>
</main>
<script>
  var token = <?!= JSON.stringify(token) ?>;
  var $ = function (id) { return document.getElementById(id); };
  function lock(on) { $('post').disabled = on; $('skip').disabled = on; $('caption').disabled = on; }
  function say(text, link) {
    $('msg').textContent = text;
    if (link && /^https:\/\//.test(link)) {
      var a = document.createElement('a'); a.href = link; a.textContent = 'Instagramで見る'; a.target = '_blank';
      $('msg').appendChild(document.createElement('br')); $('msg').appendChild(a);
    }
  }
  function show(d) {
    if (d.state === 'なし') { $('sub').textContent = 'この投稿候補は見つかりませんでした'; return; }
    $('sub').textContent = d.pillar + ' / ' + d.product;
    $('body').classList.remove('hide');
    if (d.video) $('video').src = d.video;
    $('caption').value = d.caption || '';
    if (d.memo) { $('memo').textContent = d.memo; $('memo').classList.remove('hide'); }
    if (d.state !== '確認待ち') {
      lock(true);
      say({ '投稿済み': '投稿済みです', '見送り': '見送り済みです', '投稿中': '投稿中です',
            '処理待ち': 'Instagram側で処理中です', '作成中': '動画を作っています', '動画待ち': '動画を作っています',
            '失敗': '動画を作れませんでした' }[d.state] || d.state, d.permalink);
    }
  }
  function done(r) { say(r.message, r.permalink); if (!r.ok) lock(false); }
  function fail(e) { say('うまくいきませんでした: ' + (e && e.message || e)); lock(false); }
  $('post').onclick = function () {
    lock(true); say('投稿しています… このまま1〜2分お待ちください');
    google.script.run.withSuccessHandler(done).withFailureHandler(fail).publish(token, $('caption').value);
  };
  $('skip').onclick = function () {
    lock(true); say('見送っています…');
    google.script.run.withSuccessHandler(done).withFailureHandler(fail).skip(token);
  };
  google.script.run.withSuccessHandler(show).withFailureHandler(fail).getReview(token);
</script>
</body>
</html>
